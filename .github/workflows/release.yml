# Release build – triggered manually from the Actions tab.
#
# Builds the server (worldserver + bnetserver) with AI Playerbots on
# Windows Server 2022, packages the binaries with SQL, config, docs and
# all required DLLs, and publishes a GitHub Release with a downloadable
# archive.  Windows is the only build target - the Linux job was removed.
# (The publish job still runs on an Ubuntu runner; it only assembles the
# release notes and calls the GitHub Release API, it does not build.)
#
# Usage:  Actions → Release → Run workflow → fill in the tag name.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3.4.3-bots-1). Leave empty for auto-generated."
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
      build_type:
        description: "CMake build type"
        type: choice
        options:
          - RelWithDebInfo
          - Release
        default: RelWithDebInfo
# Lets a failing job post its extracted compiler errors back to the commit that
# was built (see .github/actions/report-build-failure).  Jobs that need more
# (e.g. publish-release) declare their own permissions block below.
permissions:
  contents: write
  pull-requests: write

jobs:
  # ==================================================================
  #  Windows release build
  # ==================================================================
  release-windows:
    name: Release (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact_name }}

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          # The vcpkg copy that ships with the runner image is used as-is.
          #
          # It is deliberately NOT pinned to an older release: an old vcpkg asks
          # the MSYS2 mirrors for package revisions they dropped long ago
          # (msys2-runtime-3.5.4-2), so every port that runs a pkgconfig fixup
          # fails - bzip2 first, then openssl - and the dependency step dies:
          #   error: https://repo.msys2.org/msys/x86_64/msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst: 404
          # Modern Boost is handled in the source instead:
          #   * Boost 1.86 moved the Boost.Process v1 headers under
          #     boost/process/v1/, and Boost 1.88 removed the old top-level
          #     paths.  src/common/Utilities/StartProcess.cpp picks the right set
          #     by BOOST_VERSION, and dep/boost/CMakeLists.txt defines
          #     BOOST_PROCESS_VERSION=1 so the v1 names stay visible to
          #     `using namespace boost::process;` on every Boost release.
          #   * Boost 1.87 stopped pulling <boost/filesystem/directory.hpp> in
          #     from <boost/filesystem/operations.hpp>; the six core files that
          #     use directory iterators now include it explicitly.
          #   * Boost 1.72 extracted filesystem_error into
          #     <boost/filesystem/exception.hpp> and kept it reachable from
          #     operations.hpp only as a deprecated implicit include that later
          #     releases dropped.  The two extraction tools that catch
          #     boost::filesystem::filesystem_error
          #     (src/tools/map_extractor/System.cpp and
          #     src/tools/vmap4_extractor/vmapexport.cpp) now include
          #     <boost/filesystem/exception.hpp> explicitly.
          #   * Boost 1.87 removed <boost/asio/io_service.hpp>; the playerbot
          #     command server now uses boost::asio::io_context.
          #
          # Everything printed here and by the vcpkg install step is tee'd into
          # deps.log, because the Actions job log is not always retrievable when
          # triaging a red run.
          $depsLog = Join-Path $env:GITHUB_WORKSPACE "deps.log"
          if (Test-Path $depsLog) { Remove-Item $depsLog -Force }
          Start-Transcript -Path $depsLog -Append | Out-Null
          Push-Location $env:VCPKG_ROOT
          try {
            .\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg.bat failed" }
            Write-Host "vcpkg in use:"
            .\vcpkg.exe version
          } finally {
            Pop-Location
            Stop-Transcript | Out-Null
          }

      - name: Install dependencies via vcpkg
        shell: pwsh
        env:
          # Some ports still carry cmake_minimum_required(VERSION <3.5), which
          # the runner's CMake 4.x rejects outright.  This is CMake's documented
          # escape hatch for old projects and a no-op on CMake 3.x.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          # dep/boost/CMakeLists.txt only asks find_package(Boost ...) for the
          # *compiled* components, so installing just those leaves out every
          # header-only Boost library the core actually includes.  The build then
          # dies in src/common with
          #   error C1083: Cannot open include file: 'boost/asio/ip/address.hpp'
          # (and boost/property_tree/ini_parser.hpp, boost/process/args.hpp, ...).
          #
          # The header-only list below is derived from every `#include <boost/...>`
          # in src/ : asio, beast, process, algorithm, dll, uuid, dynamic_bitset,
          # preprocessor, multi_index, graph, accumulators, heap, container,
          # circular_buffer, stacktrace, smart_ptr, property_tree, property_map,
          # core, bind.  The root-level boost/version.hpp (included by
          # src/common/Asio/AsioHacksFwd.h) ships with boost-config,
          # which every one of these ports already depends on.
          # boost-iostreams is installed as [core], i.e. without its bzip2 / lzma /
          # zlib / zstd default features.  src/ only ever includes
          # <boost/iostreams/copy.hpp> (StartProcess.cpp) and never instantiates a
          # compression filter, and those four ports are all built with MSYS2
          # tooling - the same tooling whose deleted package revisions made a
          # pinned vcpkg unusable:
          #   error: building bzip2:x64-windows failed with: BUILD_FAILED
          # openssl below needs MSYS2 anyway, so there is no reason to widen that
          # surface for code this server never compiles.  Nothing is lost:
          # TrinityCore builds its own zlib from dep/zlib, and every other port
          # below has no default features of its own.
          $triplet = "x64-windows"
          $ports = @(
            # compiled components requested by find_package(Boost ...)
            "boost-system", "boost-filesystem", "boost-program-options",
            "boost-iostreams[core]", "boost-regex", "boost-locale", "boost-thread",
            # header-only libraries included directly by the core / scripts / plugins
            "boost-asio", "boost-beast", "boost-process",
            "boost-algorithm", "boost-dll", "boost-uuid", "boost-dynamic-bitset",
            "boost-preprocessor", "boost-multi-index", "boost-graph",
            "boost-accumulators", "boost-heap", "boost-container",
            "boost-circular-buffer", "boost-stacktrace", "boost-smart-ptr",
            "boost-property-tree", "boost-property-map", "boost-core",
            "boost-bind", "boost-foreach", "boost-optional",
            # TLS / crypto
            "openssl"
          ) | ForEach-Object { "$($_)`:$triplet" }

          $depsLog  = Join-Path $env:GITHUB_WORKSPACE "deps.log"
          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $portList = $ports -join " "

          Write-Host "Installing $($ports.Count) vcpkg ports ($triplet)"
          Add-Content -Path $depsLog -Value "`n=== vcpkg install $portList ==="
          cmd /c "`"$vcpkgExe`" install $portList >> `"$depsLog`" 2>&1"
          $code = $LASTEXITCODE
          Write-Host "vcpkg install exit code: $code"
          if (Test-Path $depsLog) { Get-Content $depsLog -Tail 150 }
          if ($code -ne 0) { exit $code }
        timeout-minutes: 300

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE\release\trinitycore-3.4.3" `
            -DSERVERS=1 `
            -DTOOLS=1 `
            -DSCRIPTS=static `
            -DWITH_DYNAMIC_LINKING=0 `
            -DUSE_COREPCH=1 `
            -DUSE_SCRIPTPCH=1 `
            -DWITH_WARNINGS=0 `
            -DWITHOUT_GIT=1 `
            -DCOPY_CONF=1

      - name: Build
        shell: pwsh
        run: |
          # Capture stdout+stderr into build.log so the failure report can extract
          # the MSVC compiler/linker errors, and retry: MSBuild stops scheduling
          # work as soon as a project fails, so re-running surfaces the errors of
          # the projects that never got compiled in the first pass.
          $log = Join-Path $env:GITHUB_WORKSPACE "build.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $code = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "=== build attempt $attempt ==="
            Add-Content -Path $log -Value "=== build attempt $attempt ==="
            cmd /c "cmake --build build --config ${{ inputs.build_type }} -- /m /p:CL_MPCount=2 >> `"$log`" 2>&1"
            $code = $LASTEXITCODE
            Write-Host "attempt $attempt finished with exit code $code"
            if ($code -eq 0) { break }
          }
          if (Test-Path $log) { Get-Content $log -Tail 100 }
          if ($code -ne 0) { exit $code }

      - name: Install
        shell: pwsh
        run: |
          cmake --install build --config ${{ inputs.build_type }}

      - name: Bundle SQL, config, docs, DLLs, and launcher
        shell: pwsh
        run: |
          $DEST = "$env:GITHUB_WORKSPACE\release\trinitycore-3.4.3"
          $BINDIR = "$DEST\bin"

          # --- Normalise the install layout -----------------------------------
          # The Windows install rules in the CMakeLists use
          #   install(TARGETS ... DESTINATION "${CMAKE_INSTALL_PREFIX}")
          # so `cmake --install` drops the .exe files (and the *.conf.dist
          # templates) straight into $DEST instead of $DEST\bin and $DEST\etc
          # the way the Unix rules do.  Everything below - the DLL copies, the
          # launcher (bin\worldserver.exe) and Setup-Database.bat (which reads
          # %ROOT%etc\worldserver.conf.dist) - expects the bin\ / etc\ layout,
          # so move the installed files into place first.
          New-Item -ItemType Directory -Force "$BINDIR"     | Out-Null
          New-Item -ItemType Directory -Force "$DEST\etc"   | Out-Null

          $movedExe = @(Get-ChildItem "$DEST\*.exe" -ErrorAction SilentlyContinue)
          foreach ($f in $movedExe) {
            Move-Item $f.FullName -Destination "$BINDIR\" -Force
            Write-Host "  moved $($f.Name) -> bin\"
          }
          $movedConf = @(Get-ChildItem "$DEST\*.conf.dist" -ErrorAction SilentlyContinue)
          foreach ($f in $movedConf) {
            Move-Item $f.FullName -Destination "$DEST\etc\" -Force
            Write-Host "  moved $($f.Name) -> etc\"
          }

          # --- shared dependency DLLs ---
          # dep/openssl_ed25519 is the one vendored dependency that is built SHARED
          # unconditionally (everything else follows WITH_DYNAMIC_LINKING), so
          # worldserver.exe and bnetserver.exe import openssl_ed25519.dll and die on
          # load with "The code execution cannot proceed because
          # openssl_ed25519.dll was not found" unless it sits next to them.  Like the
          # other install rules it is installed into the package root, so move every
          # stray .dll in place before the vcpkg DLLs are added below.
          foreach ($d in @(Get-ChildItem "$DEST\*.dll" -ErrorAction SilentlyContinue)) {
            Move-Item -LiteralPath $d.FullName -Destination "$BINDIR\" -Force
            Write-Host "  moved $($d.Name) -> bin\"
          }
          if (-not (Test-Path "$BINDIR\openssl_ed25519.dll")) {
            # Only a problem if the build actually produced a shared ed25519; if the
            # dependency is ever switched to static this check must stay silent.
            $builtSharedEd = Get-ChildItem "$env:GITHUB_WORKSPACE\build\bin\*\openssl_ed25519.dll" -ErrorAction SilentlyContinue
            if ($builtSharedEd) {
              Write-Host "::error::openssl_ed25519.dll was built but is not next to the executables"
              exit 1
            }
          }

          # --- SQL ---
          New-Item -ItemType Directory -Force "$DEST\sql" | Out-Null
          Copy-Item -Recurse -Force "sql\base"   "$DEST\sql\" -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "sql\create"  "$DEST\sql\" -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "sql\custom"  "$DEST\sql\" -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "sql\updates" "$DEST\sql\" -ErrorAction SilentlyContinue

          # --- Config ---
          # All playerbot defaults are in the main template moved above.
          if (-not (Test-Path "$DEST\etc\worldserver.conf.dist")) {
            throw "worldserver.conf.dist (including AI Playerbot settings) is missing from the install"
          }

          # --- bnetserver TLS material ---
          # bnetserver refuses to start without its certificate and dies with
          #   OSSL_STORE_open failed: The system cannot find the file specified
          #   Failed to initialize SSL context
          # because CertificatesFile defaults to "./bnetserver.cert.pem" relative
          # to the working directory, which the launcher sets to bin\.  The
          # install rule (install(FILES ... DESTINATION "${CMAKE_INSTALL_PREFIX}"))
          # drops the two .pem files into $DEST, and the normalisation above only
          # moves *.exe / *.conf.dist, so move them into bin\ too - falling back
          # to the source tree if the install did not produce them - and fail the
          # release rather than shipping a zip whose bnetserver cannot start.
          foreach ($pem in @("bnetserver.cert.pem", "bnetserver.key.pem")) {
            $pemSource = @("$DEST\$pem", "src\server\bnetserver\$pem") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $pemSource) {
              throw "$pem is missing from both the install tree and src\server\bnetserver"
            }
            $destination = Join-Path $BINDIR $pem
            if ((Split-Path -Parent $pemSource) -eq $DEST) {
              # Move, do not copy: two .pem files in one package drift apart and
              # only the one next to the executable is ever read.
              Move-Item -LiteralPath $pemSource -Destination $destination -Force
            } else {
              Copy-Item -LiteralPath $pemSource -Destination $destination -Force
            }
            Write-Host "  placed $pem -> bin\"
          }

          # --- Docs ---
          New-Item -ItemType Directory -Force "$DEST\docs" | Out-Null
          Copy-Item "docs\Playerbots.md" "$DEST\docs\" -ErrorAction SilentlyContinue
          Copy-Item "README.md" "$DEST\" -ErrorAction SilentlyContinue

          # --- vcpkg DLLs (OpenSSL, Boost, zlib, etc.) ---
          $VCINST = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          if (Test-Path $VCINST) {
            Write-Host "Copying vcpkg DLLs from $VCINST ..."
            Copy-Item "$VCINST\*.dll" "$BINDIR\" -ErrorAction SilentlyContinue
            Get-ChildItem "$BINDIR\*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          }

          # --- MySQL client DLL ---
          # The pre-installed MySQL Server on the runner provides libmysql.dll.
          $MYSQL_PATHS = @(
            "C:\Program Files\MySQL\MySQL Server 8.0\lib",
            "C:\Program Files\MySQL\MySQL Server 8.4\lib",
            "C:\Program Files (x86)\MySQL\MySQL Server 8.0\lib"
          )
          foreach ($mp in $MYSQL_PATHS) {
            $dll = Join-Path $mp "libmysql.dll"
            if (Test-Path $dll) {
              Write-Host "Copying MySQL DLL: $dll"
              Copy-Item $dll "$BINDIR\" -Force
              break
            }
          }
          # Fallback: search vcpkg if we installed libmysql there
          $vcpkg_mysql = "$env:VCPKG_ROOT\installed\x64-windows\bin\libmysql.dll"
          if ((-not (Test-Path "$BINDIR\libmysql.dll")) -and (Test-Path $vcpkg_mysql)) {
            Write-Host "Copying MySQL DLL from vcpkg"
            Copy-Item $vcpkg_mysql "$BINDIR\" -Force
          }
          # If the servers were linked against the shared client library, a package
          # without it is a package whose worldserver.exe will not even start:
          #   The code execution cannot proceed because libmysql.dll was not found
          # which is the same dead end the ed25519 DLL above produces, so fail the
          # release instead of publishing it. A static MySQL link is fine without it.
          $cache = Join-Path $env:GITHUB_WORKSPACE "build\CMakeCache.txt"
          if ((-not (Test-Path "$BINDIR\libmysql.dll")) -and (Test-Path $cache)) {
            if ((Get-Content $cache -Raw) -match "(?m)^MYSQL_LIBRARY:FILEPATH=.*libmysql") {
              Write-Host "::error::the servers link against the shared libmysql, but bin\libmysql.dll is missing - no MySQL Server installation could be found to copy it from"
              exit 1
            }
            Write-Host "  libmysql.dll not in bin\ (MYSQL_LIBRARY is not the shared client library, so that is fine)"
          }

          # --- MSVC Runtime DLLs ---
          # Deploy the VC++ redistributable DLLs next to the executables
          # so the server runs on any Windows 10/11 machine without a
          # separate VC++ Redist install.
          $VCREDIST = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT"
          $found = Get-ChildItem -Path $VCREDIST -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            # Try the Enterprise path specifically
            $VCREDIST2 = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT"
            $found = Get-ChildItem -Path $VCREDIST2 -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($found) {
            Write-Host "Copying MSVC runtime DLLs from $($found.FullName) ..."
            Copy-Item "$($found.FullName)\*.dll" "$BINDIR\" -ErrorAction SilentlyContinue
          } else {
            # Last resort: use vcpkg's MSVC merge module or just warn
            Write-Warning "Could not find MSVC redistributable DLLs. Users may need to install the VC++ Redistributable."
            # Try to find the DLLs in the system
            $sys32 = "$env:SystemRoot\System32"
            foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "concrt140.dll")) {
              $src = Join-Path $sys32 $dll
              if (Test-Path $src) {
                Write-Host "  Copying $dll from System32"
                Copy-Item $src "$BINDIR\" -Force
              }
            }
          }

          # --- Database setup scripts ---
          # The .bat files are double-click launchers only. The real logic is
          # in the sibling .ps1 files; shipping one without the other breaks
          # first-run setup in the release zip.
          $dbScripts = @(
            'Setup-Database.bat', 'Setup-Database.ps1',
            'Start-Database.bat', 'Start-Database.ps1',
            'Stop-Database.bat',  'Stop-Database.ps1'
          )
          foreach ($s in $dbScripts) {
            if (-not (Test-Path $s)) { throw "Missing database script: $s" }
            Copy-Item $s "$DEST\" -Force
            Write-Host "  Copied $s"
          }

          # --- Launcher batch files ---
          # Setup-Database.bat leaves the portable MariaDB running, but a reboot
          # stops it, and the servers then sit in their reconnect loop with only a
          # "Can't connect to MySQL server" line to explain it. Both launchers
          # therefore make sure the database is up before starting the server.
          $ensureDb = @(
            'rem The servers need MariaDB on 127.0.0.1:3306; start the portable',
            'rem instance that Setup-Database.bat installed when nothing is running.',
            'tasklist /FI "IMAGENAME eq mysqld.exe" 2>nul | find /i "mysqld.exe" >nul',
            'if not errorlevel 1 goto dbready',
            'if not exist "%~dp0Start-Database.ps1" goto dbready',
            'echo [INFO] MariaDB is not running - starting the portable instance ...',
            'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Start-Database.ps1" -NonInteractive',
            ':dbready'
          ) -join "`r`n"

          @"
          @echo off
          title TrinityCore 3.4.3 World Server
          echo ============================================================
          echo   TrinityCore 3.4.3 + AI Playerbots
          echo ============================================================
          echo.
          echo If this is your first time, run Setup-Database.bat first!
          echo It will download and configure a portable MariaDB database
          echo and import the world + hotfixes game data.
          echo.
          echo Starting worldserver...
          echo.
          cd /d "%~dp0bin"
          $ensureDb
          rem Both executables import openssl_ed25519.dll (dep/openssl_ed25519 is the
          rem one dependency that is always built as a shared library) and Windows
          rem refuses to start them without it.
          if exist openssl_ed25519.dll goto start
          echo [WARN] openssl_ed25519.dll is not in bin\.  If worldserver.exe does not
          echo        start, that is the reason - copy the .dll files from the build
          echo        output directory (build\bin\^<Config^>) next to the executables.
          echo.
          :start
          worldserver.exe
          pause
          "@ | Set-Content "$DEST\start-worldserver.bat" -Encoding ASCII

          @"
          @echo off
          title TrinityCore 3.4.3 Battle.net Server
          echo ============================================================
          echo   TrinityCore 3.4.3 - Battle.net / Login Server
          echo ============================================================
          echo.
          echo If this is your first time, run Setup-Database.bat first!
          echo.
          echo Starting bnetserver...
          echo.
          cd /d "%~dp0bin"
          $ensureDb
          if exist bnetserver.cert.pem if exist bnetserver.key.pem goto start
          rem GenerateSelfSignedCertificate lets bnetserver create the files itself,
          rem so the check below only applies when it is off (the default).
          findstr /i /r /c:"^[ ]*GenerateSelfSignedCertificate[ ]*=[ ]*1" bnetserver.conf ..\etc\bnetserver.conf >nul 2>&1 && goto start
          echo [ERROR] bnetserver needs bnetserver.cert.pem and bnetserver.key.pem
          echo         in bin\, next to bnetserver.exe, to open its TLS listener.
          echo         Without them it stops with "Failed to initialize SSL context".
          echo         Copy both files into bin\ - they live in the source tree under
          echo         src\server\bnetserver - point CertificatesFile in bnetserver.conf
          echo         at a certificate of your own, or set
          echo         GenerateSelfSignedCertificate = 1 there to have a self-signed
          echo         key pair created on the next start.
          echo.
          pause
          exit /b 1
          :start
          bnetserver.exe
          pause
          "@ | Set-Content "$DEST\start-bnetserver.bat" -Encoding ASCII

          @"
          @echo off
          title TrinityCore 3.4.3 - Client data extraction
          echo ============================================================
          echo   Extracting dbc / maps / vmaps / mmaps from a WoW 3.4.3 client
          echo ============================================================
          echo.
          echo All four tools write into the CURRENT directory, which is why this
          echo script switches to bin\ first - that is where worldserver.exe looks
          echo for its data (DataDir = "." in worldserver.conf).  Extraction of the
          echo movement maps takes a while; run it once.
          echo.
          if "%~1"=="" (
            echo Usage:  Extract-ClientData.bat "C:\World of Warcraft"
            echo         ^(the directory holding the Data folder of the client^)
            echo.
            pause
            exit /b 1
          )
          cd /d "%~dp0bin"
          set "CLIENT=%~1"

          echo [1/4] mapextractor.exe -i "%CLIENT%"
          rem -i is the client, -o would pick the output directory; both default to "."
          mapextractor.exe -i "%CLIENT%"
          if errorlevel 1 echo [WARN] mapextractor failed - check the client path.

          echo [2/4] vmap4extractor.exe -d "%CLIENT%"
          rem -d is the client for this tool; it has no output switch and always
          rem writes .\Buildings into the current directory
          vmap4extractor.exe -d "%CLIENT%"
          if errorlevel 1 echo [WARN] vmap4extractor failed - check the client path.

          echo [3/4] vmap4assembler.exe Buildings vmaps
          vmap4assembler.exe Buildings vmaps
          if errorlevel 1 echo [WARN] vmap4assembler failed - it needs Buildings from step 2.

          echo [4/4] mmaps_generator.exe
          rem no client needed: it reads .\vmaps and creates .\mmaps in the current
          rem directory, so it has to run in bin\ like the server does
          mmaps_generator.exe
          if errorlevel 1 echo [WARN] mmaps_generator failed - see docs/MapData.md.

          echo.
          echo Done.  bin\ should now hold dbc, maps, Cameras, vmaps and mmaps.
          echo Keep them there, or set DataDir in etc\worldserver.conf to the
          echo directory that holds them.
          pause
          "@ | Set-Content "$DEST\Extract-ClientData.bat" -Encoding ASCII

          # --- README for the zip ---
          @"
          TrinityCore 3.4.3 Server + AI Playerbots (Windows x64)
          =======================================================

          QUICK START - four steps, in this order:
            1. Double-click Setup-Database.bat
               Downloads a portable MariaDB into database\, creates auth,
               characters, world and hotfixes, downloads + checksum-verifies +
               imports the world and hotfixes game data, applies sql\updates,
               seeds the realm row in auth.realmlist and writes
               etc\worldserver.conf and etc\bnetserver.conf with the database
               credentials already filled in.  It leaves the database running.
            2. Extract the client data (see "Client data" below; a one-time,
               slow step).  This is not optional: worldserver exits when the
               dbc or vmaps directory it resolved from DataDir is missing, and
               says which directory that was.  If you already have dbc, maps,
               vmaps and mmaps folders from another server, copy them into
               bin\ instead of extracting again.
            3. Double-click start-bnetserver.bat, then start-worldserver.bat,
               and keep both windows open.  Each launcher starts the portable
               MariaDB first if nothing is running (for instance after a
               reboot), then runs its server from bin\.
            4. In the worldserver window, type:
                 bnetaccount create you@example.com yourpassword
               The login name has to contain an @ - Battle.net accounts are
               addressed by e-mail.  It prints the game account name it created
               alongside; to make yourself a GM, type
                 account set seclevel <that game account name> 2
               Then start a WoW 3.4.3.54261 client pointed at this machine and
               log in: bnetserver answers on 1119, the REST login on 8081, the
               realm itself on 8085.

          Client data, in short:
            Extract-ClientData.bat "C:\path\to\WoW"
            It runs the four tools from inside bin\, which is where their output
            has to land; mapextractor takes -i for the client, vmap4extractor -d,
            vmap4assembler takes Buildings and vmaps as plain arguments and
            mmaps_generator takes no client at all - it reads .\vmaps and writes
            .\mmaps, both relative to the current directory.  Relative settings
            such as DataDir, LogsDir and the certificate files are looked for in
            the working directory, next to the executable and next to the .conf,
            so bin\ is the one place that always works.

          If the login screen accepts the password but the realm never connects:
            the realm list hands the client a realm name built from
            Region-Battlegroup-RealmID of the auth.realmlist row (1-1-1 for the
            row Setup-Database.bat seeds), and the client resolves that name
            itself.  Add "127.0.0.1  1-1-1" to
            C:\Windows\System32\drivers\etc\hosts when it does not resolve,
            or put the real address of this machine in auth.realmlist.address.

          Database scripts:
            Setup-Database.bat   - First-time setup (MariaDB + all game data)
            Start-Database.bat   - Start the database (the launchers do this too)
            Stop-Database.bat    - Stop the database
            *.ps1                - Keep these next to the .bat files; do not delete them

          Server launchers:
            start-worldserver.bat - Start the game server
            start-bnetserver.bat  - Start the Battle.net / login server

          Contents:
            bin\          - worldserver.exe, bnetserver.exe, extraction tools, DLLs
                            and bnetserver.cert.pem + bnetserver.key.pem.  Keep the
                            .pem files here: without a certificate bnetserver
                            refuses to start ("Failed to initialize SSL context").
                            The .dll files have to stay here too - both .exe files
                            load openssl_ed25519.dll and libmysql.dll from their own
                            directory, and Windows refuses to start them without it.
                            Client data, when extracted, lands here as well.
            sql\          - database schemas (base, create, custom, updates)
            etc\          - configuration files (auto-configured by Setup-Database.bat)
            docs\         - Playerbots.md documentation

          For AI Playerbot documentation, see docs\Playerbots.md
          "@ | Set-Content "$DEST\WINDOWS-README.txt" -Encoding ASCII

          Write-Host ""
          Write-Host "=== Final package contents ==="
          $packagedExe  = @(Get-ChildItem "$BINDIR\*.exe" -ErrorAction SilentlyContinue)
          $packagedDll  = @(Get-ChildItem "$BINDIR\*.dll" -ErrorAction SilentlyContinue)
          $packagedPem  = @(Get-ChildItem "$BINDIR\*.pem" -ErrorAction SilentlyContinue)
          foreach ($e in $packagedExe) { Write-Host "  bin\$($e.Name) ($([math]::Round($e.Length/1MB,1)) MB)" }
          foreach ($d in $packagedDll) { Write-Host "  bin\$($d.Name)" }
          foreach ($p in $packagedPem) { Write-Host "  bin\$($p.Name)" }

          # Fail the job loudly if the package is missing its core binaries -
          # a release zip without worldserver.exe is worse than no release at all,
          # and a zip whose bnetserver cannot start (no certificate) is not much
          # better: it is the first thing a fresh installer runs into.
          $missing = @()
          foreach ($need in @("worldserver.exe", "bnetserver.exe", "bnetserver.cert.pem", "bnetserver.key.pem")) {
            if (-not (Test-Path (Join-Path $BINDIR $need))) { $missing += "bin\$need" }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Windows package is missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "  sql\ (database schemas)"
          Write-Host "  etc\ (configuration)"
          Write-Host "  docs\ (documentation)"
          Write-Host "  Setup-Database.bat / Setup-Database.ps1 (database installer)"
          Write-Host "  Start-Database.bat / Start-Database.ps1 (database launcher)"
          Write-Host "  Stop-Database.bat / Stop-Database.ps1 (database stopper)"
          Write-Host "  start-worldserver.bat (game server launcher)"
          Write-Host "  Extract-ClientData.bat (client data extraction)"
          Write-Host "  start-bnetserver.bat (login server launcher)"

      - name: Create release archive
        id: package
        shell: pwsh
        run: |
          $TAG = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($TAG)) {
            $TAG = "build-" + (Get-Date -Format "yyyyMMdd")
          }
          $ARCHIVE = "trinitycore-3.4.3-windows-x64-$TAG.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\release\trinitycore-3.4.3" `
            -DestinationPath "$env:GITHUB_WORKSPACE\$ARCHIVE" -Force
          "artifact_name=$ARCHIVE" >> $env:GITHUB_OUTPUT
          $size = [math]::Round((Get-Item "$env:GITHUB_WORKSPACE\$ARCHIVE").Length / 1MB, 1)
          Write-Host "Archive: $ARCHIVE ($size MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_name }}
          retention-days: 7

      - name: Report build failure
        if: failure()
        uses: ./.github/actions/report-build-failure
        with:
          log-file: build.log
          extra-log: deps.log
          label: Release (Windows x64)

  # ==================================================================
  #  Publish GitHub Release
  # ==================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [release-windows]
    # Only publish when the Windows build actually produced an archive.
    if: always() && needs.release-windows.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lh artifacts/

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="build-$(date +%Y%m%d)"
          fi
          # Make sure the tag doesn't already exist; if so, append a suffix
          for i in $(seq 1 20); do
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              break
            fi
            TAG="${TAG}-$i"
          done
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Count commits since last release
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COUNT=$(git rev-list ${LAST_TAG}..HEAD --count)
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "since=$LAST_TAG" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list HEAD --count)
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "since=initial" >> $GITHUB_OUTPUT
          fi

      - name: Build release body
        id: body
        run: |
          cat > release_body.md << BODYEOF
          ## TrinityCore 3.4.3 Server with AI Playerbots (Windows x64)

          Built from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`.
          ${{ steps.commits.outputs.count }} commits since ${{ steps.commits.outputs.since }}.

          ### What's included

          | Component | Description |
          | --- | --- |
          | **worldserver.exe** | Game server with integrated AI playerbots ([ike3/mangosbot](https://github.com/ike3/mangosbot) port) |
          | **bnetserver.exe** | Authentication / Battle.net login server |
          | **mapextractor.exe** | Client DBC/DB2 data extraction |
          | **vmap4extractor.exe / vmap4assembler.exe** | Visibility map generation |
          | **mmaps_generator.exe** | Movement map (navmesh) generation |
          | **sql/** | Database schemas: base, create, custom (playerbot tables), updates |
          | **etc/** | Server configuration including all AI settings in \`worldserver.conf.dist\` |
          | **docs/Playerbots.md** | Full AI playerbot documentation |

          ### Downloads

          | Platform | Archive | Prerequisites |
          | --- | --- | --- |
          | **Windows** x64 | \`.zip\` | None — portable DB, MSVC runtime and all DLLs included |

          ### Quick start

          1. Extract the \`.zip\`
          2. Double-click **\`Setup-Database.bat\`** — downloads portable MariaDB, creates the databases, downloads + checksum-verifies + imports the world and hotfixes game data (WyrmrestCore DB release), and configures the servers automatically
          3. Extract client maps with the tools in \`bin\` (mapextractor, vmap4extractor, vmap4assembler, mmaps_generator)
          4. Double-click **\`start-worldserver.bat\`** (and \`start-bnetserver.bat\` for the login server)

          No MySQL/MariaDB installation needed — the setup script downloads a fully portable database.
          All required DLLs (OpenSSL, Boost, MySQL client, MSVC runtime) are included in the zip.

          ### Build information

          - Build type: \`${{ inputs.build_type }}\`
          - Static linking: \`WITH_DYNAMIC_LINKING=0\`
          - Scripts: \`static\` (all scripts linked into worldserver)
          BODYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "TrinityCore 3.4.3 + AI Playerbots — ${{ steps.tag.outputs.tag }}"
          body_path: release_body.md
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
