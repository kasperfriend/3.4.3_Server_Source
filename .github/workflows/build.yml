# Continuous-integration build for TrinityCore 3.4.3 + AI Playerbots.
#
# Runs on every push to main and on every pull request.  The Linux build
# is the primary verification target.  A Windows build job runs as well
# but is non-blocking (continue-on-error) because the Windows dependency
# chain (Boost / OpenSSL / MySQL via vcpkg) is significantly more fragile.

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Needed so a failing job can post its extracted compiler errors back to the
# pull request / commit (see .github/actions/report-build-failure).
permissions:
  contents: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  #  Linux build  (primary, must pass)
  # ------------------------------------------------------------------
  build-linux:
    name: Build (Ubuntu 22.04 / GCC 12)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          # Remove large unused packages to free up ~10 GB on the runner
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get purge -y --auto-remove \
            '^temurin-.*-jdk' '^openjdk-.*' '^dotnet-.*' \
            '^llvm-.*' '^google-chrome-.*' '^microsoft-edge-.*' 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-12 g++-12 \
            cmake \
            git \
            libssl-dev \
            libmysqlclient-dev \
            libboost-all-dev \
            libreadline-dev \
            zlib1g-dev \
            libbz2-dev \
            libncurses-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          dpkg -l | grep -E "libssl-dev|libmysqlclient|libboost.*dev|libreadline" | awk '{print $2, $3}'

      - name: Configure (CMake)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DSERVERS=1 \
            -DTOOLS=1 \
            -DSCRIPTS=static \
            -DWITH_DYNAMIC_LINKING=0 \
            -DUSE_COREPCH=1 \
            -DUSE_SCRIPTPCH=1 \
            -DWITH_WARNINGS=0 \
            -DWITHOUT_GIT=1 \
            -DCOPY_CONF=1 \
            2>&1 | tee cmake.log

      - name: Build
        run: |
          # `-k` keeps going after the first failing target so that a single
          # CI run reports *every* compile error instead of just the first one.
          set -o pipefail
          cmake --build build -j"$(nproc)" -- -k 2>&1 | tee build.log

      - name: Verify produced binaries
        run: |
          # NOTE: on Unix/Makefile generators TrinityCore does not set
          # CMAKE_RUNTIME_OUTPUT_DIRECTORY, so each executable is emitted inside
          # its own target directory (e.g. build/src/server/worldserver/worldserver)
          # and not into build/bin.  Only the MSVC/MinGW settings point everything
          # at build/bin.  Locate the binaries by name so this check is correct
          # for either layout.
          #
          # Target names come from src/tools/*/CMakeLists.txt: mapextractor,
          # vmap4extractor, vmap4assembler, mmaps_generator (no underscores
          # between "map"/"vmap4" and "extractor"/"assembler").
          verify() {
            local failed=0
            local LAST_BINARY=""
            local WORLDSERVER_BIN=""

            locate() {
              find build -type f -name "$1" -perm -u+x \
                -not -path "*/CMakeFiles/*" 2>/dev/null | head -n 1
            }

            check_binary() {
              local name="$1"
              local path
              path="$(locate "$name")"
              if [ -n "$path" ]; then
                printf '  OK   %-18s %s (%s)\n' "$name" "$path" "$(du -h "$path" | cut -f1)"
              else
                printf '  MISS %-18s not produced by the build\n' "$name"
                echo "::error::Expected binary '$name' was not produced by the build"
                failed=1
              fi
              LAST_BINARY="$path"
            }

            echo "=== Server binaries ==="
            check_binary worldserver
            WORLDSERVER_BIN="$LAST_BINARY"
            check_binary bnetserver

            echo ""
            echo "=== Extraction tools ==="
            local tool
            for tool in mapextractor vmap4extractor vmap4assembler mmaps_generator; do
              check_binary "$tool"
            done

            echo ""
            echo "=== Playerbot integration check ==="
            if [ -z "$WORLDSERVER_BIN" ]; then
              echo "::error::worldserver binary missing - cannot verify playerbot symbols"
              failed=1
            else
              local playerbot_symbols
              playerbot_symbols="$(nm "$WORLDSERVER_BIN" | grep -c 'Playerbot' || true)"
              echo "  ${playerbot_symbols} Playerbot symbols in worldserver"
              if nm "$WORLDSERVER_BIN" | grep -q "InitializePlayerbots"; then
                echo "  OK InitializePlayerbots found"
              else
                echo "::error::Playerbot symbols missing from worldserver"
                failed=1
              fi
              if nm "$WORLDSERVER_BIN" | grep -q "RandomPlayerbotMgr"; then
                echo "  OK RandomPlayerbotMgr found"
              else
                echo "::error::RandomPlayerbotMgr missing from worldserver"
                failed=1
              fi
            fi

            return "$failed"
          }

          verify 2>&1 | tee verify.log
          exit "${PIPESTATUS[0]}"

      - name: Report build failure
        if: failure()
        uses: ./.github/actions/report-build-failure
        with:
          log-file: build.log
          extra-log: verify.log
          label: Build (Ubuntu 22.04 / GCC 12)

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: |
            build.log
            cmake.log
            verify.log

  # ------------------------------------------------------------------
  #  Windows build  (secondary, best-effort)
  # ------------------------------------------------------------------
  build-windows:
    name: Build (Windows 2022 / MSVC)
    runs-on: windows-2022
    timeout-minutes: 360
    continue-on-error: true   # non-blocking

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd $env:VCPKG_ROOT
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          # dep/boost/CMakeLists.txt only asks find_package(Boost ...) for the
          # *compiled* components, so installing just those leaves out every
          # header-only Boost library the core actually includes.  The build then
          # dies in src/common with
          #   error C1083: Cannot open include file: 'boost/asio/ip/address.hpp'
          # (and boost/property_tree/ini_parser.hpp, boost/process/args.hpp, ...).
          #
          # The header-only list below is derived from every `#include <boost/...>`
          # in src/ : asio, beast, process, algorithm, dll, uuid, dynamic_bitset,
          # preprocessor, multi_index, graph, accumulators, heap, container,
          # circular_buffer, stacktrace, smart_ptr, property_tree, property_map,
          # core, bind (+ boost-headers for boost/version.hpp).
          $triplet = "x64-windows"
          $ports = @(
            # compiled components requested by find_package(Boost ...)
            "boost-system", "boost-filesystem", "boost-program-options",
            "boost-iostreams", "boost-regex", "boost-locale", "boost-thread",
            # header-only libraries included directly by the core / scripts / plugins
            "boost-headers", "boost-asio", "boost-beast", "boost-process",
            "boost-algorithm", "boost-dll", "boost-uuid", "boost-dynamic-bitset",
            "boost-preprocessor", "boost-multi-index", "boost-graph",
            "boost-accumulators", "boost-heap", "boost-container",
            "boost-circular-buffer", "boost-stacktrace", "boost-smart-ptr",
            "boost-property-tree", "boost-property-map", "boost-core",
            "boost-bind", "boost-foreach", "boost-optional",
            # TLS / crypto
            "openssl"
          ) | ForEach-Object { "$($_)`:$triplet" }

          Write-Host "Installing $($ports.Count) vcpkg ports ($triplet)"
          & "$env:VCPKG_ROOT\vcpkg.exe" install @ports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 300

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DSERVERS=1 `
            -DTOOLS=0 `
            -DSCRIPTS=static `
            -DWITH_DYNAMIC_LINKING=0 `
            -DUSE_COREPCH=0 `
            -DUSE_SCRIPTPCH=0 `
            -DWITH_WARNINGS=0 `
            -DWITHOUT_GIT=1 `
            -DCOPY_CONF=1

      - name: Build
        shell: pwsh
        run: |
          # Capture stdout+stderr into build.log so the failure report can extract
          # the MSVC compiler/linker errors, and retry a few times: MSBuild stops
          # scheduling work as soon as a project fails, so re-running surfaces the
          # errors of projects that never got compiled in the first pass.
          $log = Join-Path $env:GITHUB_WORKSPACE "build.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $code = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "=== build attempt $attempt ==="
            Add-Content -Path $log -Value "=== build attempt $attempt ==="
            cmd /c "cmake --build build --config RelWithDebInfo -- /m /p:CL_MPCount=2 >> `"$log`" 2>&1"
            $code = $LASTEXITCODE
            Write-Host "attempt $attempt finished with exit code $code"
            if ($code -eq 0) { break }
          }
          if (Test-Path $log) { Get-Content $log -Tail 100 }
          if ($code -ne 0) { exit $code }

      - name: Verify produced binaries
        shell: pwsh
        run: |
          $out    = Join-Path $env:GITHUB_WORKSPACE "verify.log"
          $binDir = "build\bin\RelWithDebInfo"
          $failed = 0
          $lines  = @("=== Server binaries ($binDir) ===")
          if (Test-Path $binDir) {
            foreach ($e in (Get-ChildItem "$binDir\*.exe" -ErrorAction SilentlyContinue)) {
              $lines += ("  OK   {0} ({1} MB)" -f $e.Name, [math]::Round($e.Length / 1MB, 1))
            }
            foreach ($need in @("worldserver.exe", "bnetserver.exe")) {
              if (-not (Test-Path (Join-Path $binDir $need))) {
                $lines += "  MISS $need was not produced by the build"
                $failed = 1
              }
            }
          } else {
            $lines += "  MISS $binDir does not exist"
            $failed = 1
          }
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Set-Content -Path $out -Encoding UTF8
          if ($failed -ne 0) { exit 1 }

      - name: Report build failure
        if: failure()
        uses: ./.github/actions/report-build-failure
        with:
          log-file: build.log
          extra-log: verify.log
          label: Build (Windows 2022 / MSVC)

