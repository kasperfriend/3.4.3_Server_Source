# Continuous-integration build for TrinityCore 3.4.3 + AI Playerbots.
#
# Runs on every push to main and on every pull request.  The Linux build
# is the primary verification target.  A Windows build job runs as well
# but is non-blocking (continue-on-error) because the Windows dependency
# chain (Boost / OpenSSL / MySQL via vcpkg) is significantly more fragile.

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  #  Linux build  (primary, must pass)
  # ------------------------------------------------------------------
  build-linux:
    name: Build (Ubuntu 22.04 / GCC 12)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          # Remove large unused packages to free up ~10 GB on the runner
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get purge -y --auto-remove \
            '^temurin-.*-jdk' '^openjdk-.*' '^dotnet-.*' \
            '^llvm-.*' '^google-chrome-.*' '^microsoft-edge-.*' 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-12 g++-12 \
            cmake \
            git \
            libssl-dev \
            libmysqlclient-dev \
            libboost-all-dev \
            libreadline-dev \
            zlib1g-dev \
            libbz2-dev \
            libncurses-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Show toolchain versions
        run: |
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          dpkg -l | grep -E "libssl-dev|libmysqlclient|libboost.*dev|libreadline" | awk '{print $2, $3}'

      - name: Configure (CMake)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DSERVERS=1 \
            -DTOOLS=1 \
            -DSCRIPTS=static \
            -DWITH_DYNAMIC_LINKING=0 \
            -DUSE_COREPCH=1 \
            -DUSE_SCRIPTPCH=1 \
            -DWITH_WARNINGS=0 \
            -DWITHOUT_GIT=1 \
            -DCOPY_CONF=1 \
            2>&1 | tee cmake.log

      - name: Build
        run: |
          cmake --build build -j$(nproc) 2>&1 | tee build.log

      - name: Verify produced binaries
        run: |
          echo "=== Server binaries ==="
          ls -lh build/bin/worldserver build/bin/bnetserver
          echo ""
          echo "=== Extraction tools ==="
          ls -lh build/bin/map_extractor build/bin/vmap4_extractor \
                 build/bin/vmap4_assembler build/bin/mmaps_generator
          echo ""
          echo "=== Playerbot integration check ==="
          nm build/bin/worldserver | grep -c "Playerbot" | xargs -I{} echo "  {} Playerbot symbols in worldserver"
          nm build/bin/worldserver | grep -q "InitializePlayerbots" && \
            echo "  ✓ InitializePlayerbots found" || \
            { echo "::error::Playerbot symbols missing from worldserver"; exit 1; }
          nm build/bin/worldserver | grep -q "RandomPlayerbotMgr" && \
            echo "  ✓ RandomPlayerbotMgr found" || \
            { echo "::error::RandomPlayerbotMgr missing from worldserver"; exit 1; }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux
          path: |
            build.log
            cmake.log

  # ------------------------------------------------------------------
  #  Windows build  (secondary, best-effort)
  # ------------------------------------------------------------------
  build-windows:
    name: Build (Windows 2022 / MSVC)
    runs-on: windows-2022
    timeout-minutes: 360
    continue-on-error: true   # non-blocking

    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd $env:VCPKG_ROOT
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            boost-system:x64-windows `
            boost-filesystem:x64-windows `
            boost-program-options:x64-windows `
            boost-iostreams:x64-windows `
            boost-regex:x64-windows `
            boost-locale:x64-windows `
            openssl:x64-windows
        timeout-minutes: 300

      - name: Configure (CMake)
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DSERVERS=1 `
            -DTOOLS=0 `
            -DSCRIPTS=static `
            -DWITH_DYNAMIC_LINKING=0 `
            -DUSE_COREPCH=0 `
            -DUSE_SCRIPTPCH=0 `
            -DWITH_WARNINGS=0 `
            -DWITHOUT_GIT=1 `
            -DCOPY_CONF=1

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo -- /m /p:CL_MPCount=2

      - name: Verify produced binaries
        shell: pwsh
        run: |
          Write-Host "=== Server binaries ==="
          Get-ChildItem build\bin\RelWithDebInfo\*.exe | Format-Table Name, @{N='Size(MB)';E={[math]::Round($_.Length/1MB,1)}}
